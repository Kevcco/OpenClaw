services:
  qdrant:
    image: qdrant/qdrant:v1.15.0
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/app.db
      UPLOAD_DIR: /app/uploads
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?TOKEN_HASH_SECRET must be set}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-28800}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}
      QDRANT_WAIT_SECONDS: ${QDRANT_WAIT_SECONDS:-30}
      WAIT_FOR_QDRANT: ${WAIT_FOR_QDRANT:-1}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hash}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  qdrant_data:
